{% extends 'base.html' %}
{% block title %}Dashboard | Ignite{% endblock %}
{% block content %}
<section class="ignite-dashboard container-fluid">
    <div class="ignite-dashboard-heading">
        <div>
            <span class="ignite-eyebrow"><i class="bi bi-grid-1x2"></i> Overview</span>
            <h1>Dashboard</h1>
            <p>Your campus services are one click away.</p>
        </div>
        <a href="{% url 'home' %}" class="btn btn-outline-primary"><i class="bi bi-house-door"></i> Home</a>
    </div>

    <section class="ignite-dashboard-services" aria-labelledby="available-services-title">
        <div class="ignite-dashboard-services-heading"><h2 id="available-services-title">Available services</h2><p>Jump straight to a campus tool.</p></div>
        <div class="ignite-dashboard-service-grid">
            <a id="lhtc-scheduler" class="ignite-dashboard-service tone-indigo" href="#lhtc-scheduler"><i class="bi bi-calendar2-week"></i><span>LHTC Scheduler</span></a>
            <a id="phc" class="ignite-dashboard-service tone-rose" href="{% url 'phc:home' %}"><i class="bi bi-heart-pulse"></i><span>PHC</span></a>
            <a id="bus" class="ignite-dashboard-service tone-cyan" href="{% url 'bus:dashboard' %}"><i class="bi bi-bus-front"></i><span>Bus</span></a>
            <a id="canteen" class="ignite-dashboard-service tone-orange" href="{% url 'canteen:menu' %}"><i class="bi bi-cup-hot"></i><span>Canteen</span></a>
            <a id="chatbot" class="ignite-dashboard-service tone-violet" href="#chatbot"><i class="bi bi-chat-square-dots"></i><span>Chatbot</span></a>
            <a id="lost-and-found" class="ignite-dashboard-service tone-green" href="{% url 'lost_and_found:lost' %}"><i class="bi bi-search"></i><span>Lost &amp; Found</span></a>
        </div>
    </section>
</section>
{% endblock %}
